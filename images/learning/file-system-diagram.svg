<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Simple file system</title><desc id="desc">Active, Reference and Archive folders form a shallow structure. Active contains one project with consistently named files.</desc><rect width="1200" height="675" rx="28" fill="#0b1220"/><g font-family="Inter,Arial"><text x="600" y="80" text-anchor="middle" fill="#e5e7eb" font-size="34" font-weight="800">ONE PREDICTABLE HOME</text><g fill="#17243a" stroke="#7dd3fc" stroke-width="4"><rect x="80" y="150" width="290" height="115" rx="20"/><rect x="455" y="150" width="290" height="115" rx="20"/><rect x="830" y="150" width="290" height="115" rx="20"/></g><g fill="#e5f6ff" font-size="28" font-weight="700" text-anchor="middle"><text x="225" y="220">ACTIVE</text><text x="600" y="220">REFERENCE</text><text x="975" y="220">ARCHIVE</text></g><path d="M225 265v95" stroke="#86efac" stroke-width="5"/><rect x="80" y="360" width="500" height="190" rx="22" fill="#163329" stroke="#86efac" stroke-width="4"/><text x="120" y="420" fill="#edfff2" font-size="26" font-weight="700">WORKSHOP</text><text x="120" y="470" fill="#cbd5e1" font-size="22">2026-09-11_outline_v02.docx</text><text x="120" y="515" fill="#cbd5e1" font-size="22">2026-09-11_handout_v01.pdf</text><text x="860" y="500" fill="#cbd5e1" font-size="24">Shallow • clear • searchable</text></g></svg>
