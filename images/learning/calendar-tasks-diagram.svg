<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Calendar and task list</title><desc id="desc">Fixed commitments go on a calendar. Flexible next actions go on a task list. Selected tasks can receive a time block.</desc><rect width="1200" height="675" rx="28" fill="#0b1220"/><g font-family="Inter,Arial" text-anchor="middle"><rect x="90" y="120" width="420" height="370" rx="28" fill="#17243a" stroke="#7dd3fc" stroke-width="4"/><text x="300" y="190" fill="#e5f6ff" font-size="31" font-weight="800">CALENDAR</text><text x="300" y="255" fill="#cbd5e1" font-size="23">Meeting · 10:00</text><text x="300" y="310" fill="#cbd5e1" font-size="23">Deadline · Friday</text><text x="300" y="365" fill="#cbd5e1" font-size="23">Focus block · 2:00</text><rect x="690" y="120" width="420" height="370" rx="28" fill="#17243a" stroke="#86efac" stroke-width="4"/><text x="900" y="190" fill="#edfff2" font-size="31" font-weight="800">TASK LIST</text><text x="900" y="255" fill="#cbd5e1" font-size="23">Draft outline</text><text x="900" y="310" fill="#cbd5e1" font-size="23">Review notes</text><text x="900" y="365" fill="#cbd5e1" font-size="23">Request feedback</text><path d="M690 430H520" stroke="#fbbf24" stroke-width="7"/><text x="600" y="565" fill="#cbd5e1" font-size="25">Calendar = when • Task list = what next</text></g></svg>
