<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Privacy pause before using AI</title><desc id="desc">Check the information, approved tool, possible consequences and responsible reviewer before using AI.</desc><rect width="1200" height="675" rx="28" fill="#0b1220"/><g font-family="Inter,Arial" text-anchor="middle"><circle cx="600" cy="330" r="125" fill="#17243a" stroke="#fbbf24" stroke-width="5"/><text x="600" y="315" fill="#fff4c2" font-size="34" font-weight="800">PAUSE</text><text x="600" y="360" fill="#cbd5e1" font-size="22">before sharing</text><g fill="#17243a" stroke="#7dd3fc" stroke-width="4"><rect x="60" y="85" width="310" height="130" rx="22"/><rect x="830" y="85" width="310" height="130" rx="22"/><rect x="60" y="455" width="310" height="130" rx="22"/><rect x="830" y="455" width="310" height="130" rx="22"/></g><g fill="#e5f6ff" font-size="25" font-weight="700"><text x="215" y="145">INFORMATION</text><text x="215" y="180">What am I sharing?</text><text x="985" y="145">APPROVAL</text><text x="985" y="180">Is this tool allowed?</text><text x="215" y="515">CONSEQUENCE</text><text x="215" y="550">What if it is exposed?</text><text x="985" y="515">RESPONSIBILITY</text><text x="985" y="550">Who checks the result?</text></g></g></svg>
