<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Devices connecting to a cloud data centre</title><desc id="desc">A phone and laptop connect over the internet to servers in a remote data centre. Authorized information returns to both devices.</desc><rect width="1200" height="675" rx="28" fill="#0b1220"/><g font-family="Inter,Arial" text-anchor="middle"><rect x="70" y="185" width="190" height="300" rx="28" fill="#17243a" stroke="#7dd3fc" stroke-width="4"/><rect x="112" y="230" width="106" height="174" rx="12" fill="#0b1220"/><text x="165" y="445" fill="#e5f6ff" font-size="24">PHONE</text><path d="M310 215h230v170H310z" fill="#17243a" stroke="#7dd3fc" stroke-width="4"/><path d="M275 400h300" stroke="#7dd3fc" stroke-width="12"/><text x="425" y="445" fill="#e5f6ff" font-size="24">LAPTOP</text><path d="M560 320h120" stroke="#fbbf24" stroke-width="8" stroke-dasharray="15 12"/><text x="620" y="285" fill="#fbbf24" font-size="22">INTERNET</text><rect x="710" y="105" width="420" height="450" rx="26" fill="#17243a" stroke="#86efac" stroke-width="4"/><text x="920" y="165" fill="#edfff2" font-size="29" font-weight="700">REMOTE DATA CENTRE</text><g fill="#0b1220" stroke="#86efac" stroke-width="3"><rect x="770" y="210" width="300" height="75" rx="10"/><rect x="770" y="310" width="300" height="75" rx="10"/><rect x="770" y="410" width="300" height="75" rx="10"/></g><g fill="#cbd5e1" font-size="22"><text x="920" y="258">STORAGE</text><text x="920" y="358">APPLICATIONS</text><text x="920" y="458">PROCESSING</text></g><text x="600" y="620" fill="#cbd5e1" font-size="25">Real equipment delivering a remote service</text></g></svg>
