<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three checks for AI output</title><desc id="desc">Assess consequences, verify important claims with reliable sources, and keep a person responsible for the decision.</desc><rect width="1200" height="675" rx="28" fill="#0b1220"/><g font-family="Inter,Arial" text-anchor="middle"><text x="600" y="85" fill="#e5e7eb" font-size="33" font-weight="800">BEFORE YOU RELY ON AN AI ANSWER</text><g fill="#17243a" stroke-width="4"><rect x="60" y="180" width="310" height="260" rx="25" stroke="#fbbf24"/><rect x="445" y="180" width="310" height="260" rx="25" stroke="#7dd3fc"/><rect x="830" y="180" width="310" height="260" rx="25" stroke="#86efac"/></g><g font-size="27" font-weight="800"><text x="215" y="260" fill="#fff4c2">1. CONSEQUENCE</text><text x="600" y="260" fill="#e5f6ff">2. VERIFY</text><text x="985" y="260" fill="#edfff2">3. RESPONSIBILITY</text></g><g fill="#cbd5e1" font-size="22"><text x="215" y="320">What happens</text><text x="215" y="355">if this is wrong?</text><text x="600" y="320">Check important claims</text><text x="600" y="355">against reliable sources</text><text x="985" y="320">Keep a person</text><text x="985" y="355">accountable</text></g><text x="600" y="565" fill="#cbd5e1" font-size="25">Higher stakes require stronger checking</text></g></svg>
