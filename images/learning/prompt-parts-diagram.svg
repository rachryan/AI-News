<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Five useful parts of an AI prompt</title><desc id="desc">Goal, context, audience and constraints combine to describe the desired outcome.</desc><rect width="1200" height="675" rx="28" fill="#0b1220"/><g font-family="Inter,Arial" text-anchor="middle"><text x="600" y="80" fill="#e5e7eb" font-size="32" font-weight="800">A USEFUL PROMPT</text><g fill="#17243a" stroke="#7dd3fc" stroke-width="4"><rect x="55" y="165" width="200" height="120" rx="20"/><rect x="280" y="165" width="200" height="120" rx="20"/><rect x="505" y="165" width="200" height="120" rx="20"/><rect x="730" y="165" width="200" height="120" rx="20"/></g><g fill="#e5f6ff" font-size="25" font-weight="700"><text x="155" y="235">GOAL</text><text x="380" y="235">CONTEXT</text><text x="605" y="235">AUDIENCE</text><text x="830" y="235">CONSTRAINTS</text></g><path d="M155 305 520 430M380 305 555 430M605 305v125M830 305 650 430" stroke="#7dd3fc" stroke-width="5"/><rect x="420" y="430" width="370" height="120" rx="25" fill="#163329" stroke="#86efac" stroke-width="4"/><text x="605" y="500" fill="#edfff2" font-size="27" font-weight="800">DESIRED OUTCOME</text><text x="600" y="620" fill="#cbd5e1" font-size="24">Clear direction first—human review afterwards</text></g></svg>
