<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AI pattern to reviewed output</title><desc id="desc">Examples and information flow into an AI pattern system. It produces an output that a person reviews before use.</desc><rect width="1200" height="675" rx="28" fill="#0b1220"/><g font-family="Inter,Arial" text-anchor="middle"><rect x="55" y="220" width="260" height="210" rx="24" fill="#17243a" stroke="#7dd3fc" stroke-width="4"/><text x="185" y="305" fill="#e5f6ff" font-size="29" font-weight="700">EXAMPLES</text><text x="185" y="350" fill="#cbd5e1" font-size="22">and information</text><path d="M325 325h115" stroke="#7dd3fc" stroke-width="8"/><rect x="450" y="165" width="300" height="320" rx="28" fill="#17243a" stroke="#fbbf24" stroke-width="4"/><text x="600" y="280" fill="#fff4c2" font-size="32" font-weight="800">AI PATTERNS</text><text x="600" y="330" fill="#cbd5e1" font-size="22">predict</text><text x="600" y="368" fill="#cbd5e1" font-size="22">recommend</text><text x="600" y="406" fill="#cbd5e1" font-size="22">generate</text><path d="M760 325h115" stroke="#86efac" stroke-width="8"/><rect x="885" y="220" width="260" height="210" rx="24" fill="#17243a" stroke="#86efac" stroke-width="4"/><text x="1015" y="292" fill="#edfff2" font-size="29" font-weight="700">OUTPUT</text><text x="1015" y="340" fill="#cbd5e1" font-size="22">reviewed by</text><text x="1015" y="378" fill="#cbd5e1" font-size="22">a person</text><text x="600" y="590" fill="#cbd5e1" font-size="25">Useful pattern matching still needs human judgment</text></g></svg>
