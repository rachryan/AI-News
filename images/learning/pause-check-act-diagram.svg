<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Pause, check, then act</title><desc id="desc">A three-step security method: pause before reacting, check through a trusted route, and take the safest necessary action.</desc><rect width="1200" height="675" rx="28" fill="#0b1220"/><g font-family="Inter,Arial" text-anchor="middle"><text x="600" y="90" fill="#e5e7eb" font-size="34" font-weight="800">A CALM SECURITY HABIT</text><g fill="#17243a" stroke-width="5"><rect x="65" y="185" width="310" height="285" rx="28" stroke="#fbbf24"/><rect x="445" y="185" width="310" height="285" rx="28" stroke="#7dd3fc"/><rect x="825" y="185" width="310" height="285" rx="28" stroke="#86efac"/></g><g font-size="31" font-weight="800"><text x="220" y="275" fill="#fff4c2">1. PAUSE</text><text x="600" y="275" fill="#e5f6ff">2. CHECK</text><text x="980" y="275" fill="#edfff2">3. ACT</text></g><g fill="#cbd5e1" font-size="23"><text x="220" y="335">Do not react</text><text x="220" y="372">under pressure</text><text x="600" y="335">Use a trusted</text><text x="600" y="372">route or source</text><text x="980" y="335">Take the smallest</text><text x="980" y="372">safe next step</text></g><text x="600" y="565" fill="#cbd5e1" font-size="25">Calm verification is more useful than fear</text></g></svg>
