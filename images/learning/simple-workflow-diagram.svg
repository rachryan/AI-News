<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Four-step digital workflow</title><desc id="desc">Work moves through capture, decide, act and review. Review provides feedback for improving the process.</desc><rect width="1200" height="675" rx="28" fill="#0b1220"/><g font-family="Inter,Arial" text-anchor="middle"><text x="600" y="100" fill="#e5e7eb" font-size="34" font-weight="800">A SIMPLE DIGITAL WORKFLOW</text><g fill="#17243a" stroke="#7dd3fc" stroke-width="4"><rect x="45" y="230" width="235" height="150" rx="24"/><rect x="335" y="230" width="235" height="150" rx="24"/><rect x="625" y="230" width="235" height="150" rx="24"/><rect x="915" y="230" width="235" height="150" rx="24"/></g><g fill="#e5f6ff" font-size="29" font-weight="800"><text x="162" y="320">CAPTURE</text><text x="452" y="320">DECIDE</text><text x="742" y="320">ACT</text><text x="1032" y="320">REVIEW</text></g><g stroke="#86efac" stroke-width="7"><path d="M280 305h45M570 305h45M860 305h45"/><path d="M1032 390v100H162V390" fill="none" stroke-dasharray="15 12"/></g><text x="600" y="555" fill="#cbd5e1" font-size="25">Review the result • improve the route • repeat</text></g></svg>
