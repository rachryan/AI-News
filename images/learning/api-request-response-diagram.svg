<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">API request and response</title><desc id="desc">An application sends a request through a controlled API doorway. A service checks it and sends a limited response back.</desc><rect width="1200" height="675" rx="28" fill="#0b1220"/><g font-family="Inter,Arial" text-anchor="middle"><rect x="70" y="230" width="270" height="190" rx="24" fill="#17243a" stroke="#7dd3fc" stroke-width="4"/><text x="205" y="315" fill="#e5f6ff" font-size="30" font-weight="700">APPLICATION</text><text x="205" y="360" fill="#cbd5e1" font-size="22">asks for one thing</text><rect x="465" y="175" width="270" height="300" rx="28" fill="#17243a" stroke="#fbbf24" stroke-width="4"/><text x="600" y="275" fill="#fff4c2" font-size="34" font-weight="800">API</text><text x="600" y="325" fill="#cbd5e1" font-size="22">checks rules</text><text x="600" y="360" fill="#cbd5e1" font-size="22">and permission</text><rect x="860" y="230" width="270" height="190" rx="24" fill="#17243a" stroke="#86efac" stroke-width="4"/><text x="995" y="315" fill="#edfff2" font-size="30" font-weight="700">SERVICE</text><text x="995" y="360" fill="#cbd5e1" font-size="22">finds the result</text><path d="M340 260H455" stroke="#7dd3fc" stroke-width="7"/><path d="m455 260-20-13v26z" fill="#7dd3fc"/><text x="397" y="235" fill="#7dd3fc" font-size="20">REQUEST</text><path d="M745 260H850" stroke="#fbbf24" stroke-width="7"/><path d="m850 260-20-13v26z" fill="#fbbf24"/><path d="M860 395H745" stroke="#86efac" stroke-width="7"/><path d="m745 395 20-13v26z" fill="#86efac"/><path d="M465 395H350" stroke="#86efac" stroke-width="7"/><path d="m350 395 20-13v26z" fill="#86efac"/><text x="600" y="530" fill="#86efac" font-size="23" font-weight="700">APPROVED RESPONSE</text><text x="600" y="595" fill="#cbd5e1" font-size="25">A defined doorway—not the whole system</text></g></svg>
