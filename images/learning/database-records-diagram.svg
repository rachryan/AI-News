<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Structured database records</title><desc id="desc">Three learner records use the same number, name and status fields. A filter selects the two active records.</desc><rect width="1200" height="675" rx="28" fill="#0b1220"/><g font-family="Inter,Arial"><text x="70" y="75" fill="#7dd3fc" font-size="30" font-weight="700">LEARNER RECORDS</text><g fill="#17243a" stroke="#334155" stroke-width="3"><rect x="70" y="115" width="1060" height="92" rx="14"/><rect x="70" y="225" width="1060" height="92" rx="14"/><rect x="70" y="335" width="1060" height="92" rx="14"/></g><g fill="#e5e7eb" font-size="25"><text x="110" y="170">#101</text><text x="300" y="170">Amira</text><text x="760" y="170">ACTIVE</text><text x="110" y="280">#102</text><text x="300" y="280">Jordan</text><text x="760" y="280">WAITLIST</text><text x="110" y="390">#103</text><text x="300" y="390">Lee</text><text x="760" y="390">ACTIVE</text></g><g fill="#94a3b8" font-size="18" font-weight="700"><text x="110" y="135">NUMBER</text><text x="300" y="135">NAME</text><text x="760" y="135">STATUS</text></g><rect x="320" y="500" width="560" height="84" rx="42" fill="#163329" stroke="#86efac" stroke-width="3"/><text x="600" y="552" text-anchor="middle" fill="#edfff2" font-size="25" font-weight="700">FILTER: STATUS = ACTIVE → 2 RESULTS</text></g></svg>
