<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Four email decisions</title><desc id="desc">An inbox message can be done, deferred to a task or calendar, filed for reference or deleted.</desc><rect width="1200" height="675" rx="28" fill="#0b1220"/><g font-family="Inter,Arial" text-anchor="middle"><rect x="440" y="65" width="320" height="105" rx="24" fill="#17243a" stroke="#fbbf24" stroke-width="4"/><text x="600" y="130" fill="#fff4c2" font-size="31" font-weight="800">NEW MESSAGE</text><path d="M600 170v90M600 260H150M600 260H1050M150 260v70M450 260v70M750 260v70M1050 260v70" stroke="#7dd3fc" stroke-width="5"/><g fill="#17243a" stroke="#86efac" stroke-width="4"><rect x="35" y="330" width="230" height="150" rx="22"/><rect x="335" y="330" width="230" height="150" rx="22"/><rect x="635" y="330" width="230" height="150" rx="22"/><rect x="935" y="330" width="230" height="150" rx="22"/></g><g fill="#edfff2" font-size="29" font-weight="800"><text x="150" y="415">DO</text><text x="450" y="415">DEFER</text><text x="750" y="415">FILE</text><text x="1050" y="415">DELETE</text></g><text x="600" y="575" fill="#cbd5e1" font-size="25">One message • one decision • one trusted destination</text></g></svg>
